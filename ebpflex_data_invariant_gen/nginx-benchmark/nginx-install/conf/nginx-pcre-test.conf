daemon off;
worker_processes 1;
error_log /home/nginx-install/logs/error.log debug;

events {
    worker_connections 100;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    access_log /home/nginx-install/logs/access.log;
    
    server {
        listen 8080;
        server_name localhost;
        
        # Static location
        location / {
            root html;
            index index.html;
        }
        
        # Regex locations to trigger PCRE
        location ~ ^/api/v[0-9]+/users/([0-9]+)$ {
            return 200 "User ID: $1\n";
        }
        
        location ~ \.php$ {
            return 403 "PHP files not allowed\n";
        }
        
        location ~* \.(jpg|jpeg|png|gif|ico)$ {
            expires 30d;
            return 200 "Image file\n";
        }
        
        # Case-insensitive regex
        location ~* ^/admin {
            return 403 "Admin area restricted\n";
        }
        
        # Negative regex match
        location ~ ^/secure/(?!public) {
            return 401 "Unauthorized\n";
        }
        
        # Rewrite rules using regex
        rewrite ^/oldpath/(.*)$ /newpath/$1 last;
        rewrite ^/product/([0-9]+)/(.+)$ /item?id=$1&name=$2 last;
    }
}