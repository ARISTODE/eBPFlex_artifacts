daemon off;
worker_processes 1;
error_log /home/nginx-install/logs/error.log debug;

events {
    worker_connections 100;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    access_log /home/nginx-install/logs/access.log;
    
    server {
        listen 8080;
        server_name localhost;
        
        location / {
            root html;
            index index.html;
        }
        
        location /test {
            return 200 "Test response\n";
        }
    }
}